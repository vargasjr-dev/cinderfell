name: "Admin - Reset Password (Telegram)"

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email address of the account to reset"
        required: true
        type: string

jobs:
  reset-password:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save

      - name: Install Vercel CLI
        run: bun install -g vercel

      - name: Pull environment variables from Vercel
        run: vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_bhY6xQNSaDzgiVpXhdFPXvZL
          VERCEL_PROJECT_ID: prj_bAckE5PGlllJHSE2kGL74Bq3MjPV

      - name: Generate reset token
        id: gen_token
        run: |
          set -a && source .env.local && set +a
          OUTPUT=$(bun scripts/admin-reset-password.ts "${{ inputs.email }}")
          echo "$OUTPUT"
          RESET_URL=$(echo "$OUTPUT" | grep '^RESET_URL=' | cut -d= -f2-)
          echo "reset_url=$RESET_URL" >> $GITHUB_OUTPUT

      - name: Send reset link via Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"7560699398\",\"text\":\"🔑 Password reset for ${{ inputs.email }}\\n\\n${{ steps.gen_token.outputs.reset_url }}\\n\\nExpires in 1 hour.\",\"parse_mode\":\"HTML\"}"
